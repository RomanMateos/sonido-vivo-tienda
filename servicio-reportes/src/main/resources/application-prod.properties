server.address=127.0.0.1
server.port=8088

spring.datasource.url=${REPORTES_DB_URL}
spring.datasource.username=${REPORTES_DB_USER}
spring.datasource.password=${REPORTES_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}

app.services.usuarios.url=${USUARIOS_SERVICE_URL:http://127.0.0.1:8082}
app.services.productos.url=${PRODUCTOS_SERVICE_URL:http://127.0.0.1:8083}
app.services.ventas.url=${VENTAS_SERVICE_URL:http://127.0.0.1:8084}