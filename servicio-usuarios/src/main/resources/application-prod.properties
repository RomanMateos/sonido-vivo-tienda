server.address=127.0.0.1
server.port=8082

spring.datasource.url=${USUARIOS_DB_URL}
spring.datasource.username=${USUARIOS_DB_USER}
spring.datasource.password=${USUARIOS_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.auth.service-url=${AUTH_SERVICE_URL:http://127.0.0.1:8081}
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN}