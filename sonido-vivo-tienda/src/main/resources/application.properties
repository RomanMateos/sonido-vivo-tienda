server.port=8083
spring.application.name=servicio-productos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sonido_productos?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:sonidovivo_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
app.jwt.secret=${JWT_SECRET}